# politmus-web — Vite SPA + nginx. Deploy from frontend/: `fly deploy`
app = "politmus-web"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  API_UPSTREAM = "politmus-api.flycast:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
