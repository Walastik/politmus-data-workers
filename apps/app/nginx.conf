server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed bundles and assets from expo export.
    location ^~ /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Flycast HTTP is on port 80 (Fly Proxy → API :8080). :8080 on the flycast IP RSTs.
    location ^~ /api/ {
        resolver [fdaa::3]:53 ipv6=on valid=10s;
        set $api_upstream "http://${API_UPSTREAM}";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Real client IP for the API's rate limiter (CLIENT_IP_HEADER in backend/fly.toml).
        # Overwrites any client-sent value; Fly's edge sets Fly-Client-IP and clients cannot spoof it.
        proxy_set_header X-Politmus-Client-IP $http_fly_client_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Dynamic routes are one page each in the export (member/[id].html, ...).
    location ~ ^/member/[^/]+/pacs/?$ {
        try_files "/member/[id]/pacs.html" =404;
    }
    location ~ ^/member/[^/]+/?$ {
        try_files "/member/[id].html" =404;
    }
    location ~ ^/bill/[^/]+/voters/?$ {
        try_files "/bill/[id]/voters.html" =404;
    }
    location ~ ^/bill/[^/]+/?$ {
        try_files "/bill/[id].html" =404;
    }

    # /now -> now.html; unknown paths get the not-found page, which redirects home.
    location / {
        try_files $uri $uri.html $uri/index.html /+not-found.html;
    }
}
