<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img">
  <title>Politmus background</title>
  <defs>
    <filter id="b-paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.5" result="light">
        <feDistantLight azimuth="45" elevation="75"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#F7F4EE" filter="url(#b-paper)"/>
</svg>
