name: Congress Data Ingestion

on:
  schedule:
    # Every 6 hours at minute 0 UTC (00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: congress-ingest
  cancel-in-progress: false

jobs:
  sync_congress_data:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_API_APP: politmus-api
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Scripts run on the API machine so they use Fly's private DATABASE_URL.
      # Requires GitHub secret FLY_API_TOKEN (org or personal token, not a deploy-only token).
      # -C execs the binary directly (no shell), so use an absolute python path.
      - name: Run Member Roster Ingestion
        run: flyctl ssh console -a "$FLY_API_APP" -C "/usr/local/bin/python /app/congress_client.py members"

      - name: Run Bill & Vote Ingestion
        run: flyctl ssh console -a "$FLY_API_APP" -C "/usr/local/bin/python /app/congress_client.py bills"

      - name: Run Enrichment (Summaries, Policy Areas, Dates)
        run: flyctl ssh console -a "$FLY_API_APP" -C "/usr/local/bin/python /app/congress_client.py enrich"
