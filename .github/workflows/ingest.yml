name: Congress Data Ingestion

on:
  schedule:
    # Every 12 hours at minute 0 UTC (00:00, 12:00)
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: congress-ingest
  cancel-in-progress: false

jobs:
  sync_congress_data:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_API_APP: politmus-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Scripts run on the API machine so they use Fly's private DATABASE_URL.
      # Requires GitHub secret FLY_API_TOKEN (org or personal token, not a deploy-only token).
      # -C execs the binary directly (no shell), so use an absolute python path.
      # fly-ssh.sh retries when the Fly tunnel can't be opened.
      - name: Run Member Roster Ingestion
        run: .github/scripts/fly-ssh.sh "/usr/local/bin/python /app/congress_client.py members"

      - name: Run Bill & Vote Ingestion
        run: .github/scripts/fly-ssh.sh "/usr/local/bin/python /app/congress_client.py bills --since-hours 36 --limit 500"

      - name: Run Enrichment (Summaries, Policy Areas, Dates)
        run: .github/scripts/fly-ssh.sh "/usr/local/bin/python /app/congress_client.py enrich"

      # New votes change scores; only officials whose inputs changed are rewritten.
      - name: Rescore Officials (Accountability)
        run: .github/scripts/fly-ssh.sh "/usr/local/bin/python /app/score_officials.py"
