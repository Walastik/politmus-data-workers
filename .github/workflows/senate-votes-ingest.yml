name: Senate Votes Ingestion

on:
  schedule:
    # Every 12 hours at :45 UTC, offset from Congress ingest (minute 0).
    # No need to wait for Congress ingest: Senate XML creates any missing
    # bill as a stub row, so votes never wait on a bill being stored first.
    - cron: '45 */12 * * *'
  workflow_dispatch:

concurrency:
  group: senate-votes-ingest
  cancel-in-progress: false

jobs:
  sync_senate_votes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_API_APP: politmus-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Catch up Senate.gov roll-call votes
        env:
          SECRET_DB_URL: ${{ secrets.DATABASE_URL }}
          SENATE_PROXY_URL: ${{ secrets.SENATE_PROXY_URL }}
        run: |
          # Senate.gov blocks Fly.io datacenter IPs, so we run the script on
          # the runner and proxy the DB connection to Fly.
          
          # Start a proxy to the database in the background, retrying when
          # the Fly tunnel can't be opened (flyctl exits early in that case).
          PROXY_PID=
          for attempt in 1 2 3 4; do
            flyctl proxy 5432 -a politmus-db &
            PROXY_PID=$!
            for _ in $(seq 1 30); do
              kill -0 "$PROXY_PID" 2>/dev/null || break
              (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null && break 2
              sleep 1
            done
            kill "$PROXY_PID" 2>/dev/null || true
            PROXY_PID=
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Fly proxy failed to start (attempt $attempt/4); retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          if [ -z "$PROXY_PID" ]; then
            echo "::error::Fly proxy failed to start after 4 attempts"
            exit 1
          fi

          # Rewrite the connection string to use our localhost proxy
          export DATABASE_URL=$(echo $SECRET_DB_URL | sed 's/@.*:5432/@localhost:5432/')
          
          # Run the ingestion job locally
          python backend/congress_client.py senate-votes --incremental

          # Rescore officials whose votes changed (no-op when nothing did).
          python backend/score_officials.py
          
          kill $PROXY_PID
