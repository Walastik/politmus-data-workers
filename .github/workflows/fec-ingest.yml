name: FEC Ingestion

on:
  schedule:
    # Daily 09:30 UTC, clear of the Congress (00/12), OpenStates (03/15) and
    # Senate (:45) jobs. Pre- and post-general reports land in late October
    # and early December, and this is how candidacies learn of new filings.
    - cron: '30 9 * * *'
  workflow_dispatch:

# Shared with FEC Finance Detail: one job at a time on the FEC key's
# 1,000 requests an hour.
concurrency:
  group: fec-ingest
  cancel-in-progress: false

jobs:
  load_fec_ids:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_API_APP: politmus-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Scripts run on the API machine so they use Fly's private DATABASE_URL
      # and FEC_API_KEY. Do not add the FEC key as a GitHub secret.
      # -C execs the binary directly (no shell), so use an absolute python path.
      # fly-ssh.sh retries when the Fly tunnel can't be opened.
      # No FEC requests: members' FEC IDs from congress-legislators.
      - name: Load FEC and OpenSecrets IDs onto officials
        run: .github/scripts/fly-ssh.sh "/usr/local/bin/python /app/fec_client.py crosswalk"

      # About 50 requests: every House and Senate candidate with money raised
      # and their coverage dates, then who filed a pre-general report (on the
      # general-election ballot). FEC Finance Detail syncs whoever moved.
      - name: Load this cycle's candidates
        run: .github/scripts/fly-ssh.sh "/usr/local/bin/python /app/fec_client.py candidates"
